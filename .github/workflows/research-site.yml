name: Research site
on:
  push:
    branches: [master, codex/pivot-native-fidelity]
    paths:
      - 'docs/**'
      - '.github/workflows/research-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/research-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the actual GitHub Pages Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-site
          path: ./_site
          retention-days: 7

  # Push docs changes to the mysite repo (vendored under wp_pivot_flutter/).
  # mysite is connected to Cloudflare Workers Builds, so landing the sync
  # commit there auto-deploys chinmaykabi.com/wp_pivot_flutter/.
  # Requires repo secret MYSITE_SYNC_TOKEN: a PAT with contents:write on
  # Chinmay-KB/mysite (fine-grained, repo-scoped).
  sync-to-mysite:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: research-site-sync
      cancel-in-progress: false
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: research-site
          path: _site_cf
      - name: Drop non-site files
        run: rm -f _site_cf/ROADMAP.html
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Chinmay-KB/mysite
          token: ${{ secrets.MYSITE_SYNC_TOKEN }}
          path: mysite
      - name: Sync built site into mysite/wp_pivot_flutter
        run: |
          rm -rf mysite/wp_pivot_flutter
          mkdir -p mysite/wp_pivot_flutter
          cp -R _site_cf/. mysite/wp_pivot_flutter/
      - name: Commit and push if changed
        working-directory: mysite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wp_pivot_flutter
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync WP research site from Chinmay-KB/wp_pivot_flutter@${{ github.sha }}"
            git push origin main
          fi
