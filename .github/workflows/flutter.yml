name: Flutter
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.22.0
          channel: stable
          cache: true
      - name: Resolve package without the newer example
        run: flutter pub get --no-example
      - name: Analyze package at its declared minimum
        run: flutter analyze --no-pub
      - name: Test package at its declared minimum
        run: flutter test --no-pub
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/components/requirements.txt
      - name: Analyze package
        run: flutter analyze
      - name: Test package
        run: flutter test
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Install evidence-tool dependencies
        run: python -m pip install -r tools/components/requirements.txt
      - name: Test evidence tools
        run: python -m unittest discover -s tools/components -p 'test_*.py' -v
