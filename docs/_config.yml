# Site config for wp_pivot_flutter research site
title: WP Pivot Research
tagline: Recreating Windows Phone in Flutter, with traceable native evidence.
description: >-
  A research project preserving the Windows Phone / Metro design language:
  recording native controls, measuring motion, color and typography, and
  rebuilding them in Flutter. Emulator and hardware sources are identified
  separately, with raw evidence and limitations beside the findings.
url: https://chinmay-kb.github.io/wp_pivot_flutter
baseurl: /wp_pivot_flutter
github_repo: https://github.com/Chinmay-KB/wp_pivot_flutter

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - "*.sh"
