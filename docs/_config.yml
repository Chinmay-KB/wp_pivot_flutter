# Site config for wp_pivot_flutter research site
title: WP Pivot Research
tagline: Recording Windows Phone behavior and rebuilding its interaction patterns in Flutter.
description: >-
  WP Pivot Research records the Windows Phone design language from labeled
  emulator and hardware sources. Measurements are published with their source
  data and limits.
url: https://chinmaykabi.com
baseurl: /wp_pivot_flutter
# Served via Cloudflare Workers Static Assets (mysite worker) — built HTML is
# vendored into mysite/wp_pivot_flutter/. See tool/sync_cloudflare_site.py.
# Large capture assets (video, raw frames) live in R2, not in git.
assets_base_url: https://assets.chinmaykabi.com/wp-pivot
github_repo: https://github.com/Chinmay-KB/wp_pivot_flutter

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - "*.sh"
