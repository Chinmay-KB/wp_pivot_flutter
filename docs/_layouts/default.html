<!DOCTYPE html>
<!--
  DIRECTION CONTRACT (impeccable new-work, user-pinned brief: authentic Metro)
  THESIS: The site IS a Windows Phone start screen. Navigation is a tile grid on
  true black; content pages read as WP8.1 system pages (light type ramp,
  hairline rules). Refuses: generic doc-site cards, sidebar layouts, soft
  rounded "AI beige", em-dash reveals in headings.
  OWN-WORLD: #000 ground, Segoe UI/Selawik Light type ramp (Light 200 display /
  Regular 400 body), one accent (#1ba1e2) used in WP's own grammar (selected
  nav state, step numerals, th color, links, one accent tile per grid),
  square flat tiles (#1d1d1d) with tight 8px gutters, lowercase labels,
  thin #2a2a2a separators, border-radius banned on all system surfaces,
  no drop shadows.
  STORY: visitor lands on a start screen of tiles -> taps into research
  sections that feel like native WP settings/hub pages. The site itself is
  the project's first proof of fidelity.
  FIRST VIEWPORT: full-black; left-aligned huge light-weight wordmark +
  tagline; lowercase nav row with pivot-style selected state; below it a
  tile grid (wide accent encyclopedia tile + dark tiles).
  FORM: user-pinned direction (authentic Metro), code-first build. seed key:
  pinned-brief-metro-2026. FINISH: unreviewed and undocumented is unfinished;
  this build ends with the finish review, the verdict, DESIGN.md, and every
  shipping raster carrying its provenance.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --accent: #1ba1e2;          /* phone blue */
      --bg: #000000;              /* true black, like an AMOLED WP */
      --surface: #111111;         /* slightly raised */
      --fg: #ffffff;
      --fg-dim: #a6a6a6;          /* WP secondary text */
      --hairline: #2a2a2a;
      --tile-a: #1ba1e2;          /* accent tile */
      --tile-dark: #1d1d1d;       /* dark tile */
    }
    * { box-sizing: border-box; }
    html, body, button, input, select, textarea, pre, code,
    .tile, .status-badge, table, th, td, blockquote {
      border-radius: 0;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", "Selawik", -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      line-height: 1.6;
    }

    .wrap { max-width: 1024px; margin: 0 auto; padding: 0 24px 96px; }

    /* ---- header: WP system tray feel ---- */
    header.site { background: transparent; }
    header.site .wrap { padding-top: 20px; padding-bottom: 8px; }
    .brand h1 {
      margin: 0; font-size: clamp(30px, 5vw, 44px);
      font-weight: 200; letter-spacing: -0.01em; line-height: 1.05;
    }
    .brand h1 a { color: var(--fg); text-decoration: none; }
    .tagline {
      display: block; margin-top: 2px;
      color: var(--fg-dim); font-size: 14px; font-weight: 300;
    }
    nav.main {
      margin-top: 18px; display: flex; flex-wrap: wrap; gap: 4px 26px;
      text-transform: lowercase;
    }
    nav.main a {
      color: var(--fg); text-decoration: none; font-size: 15px; font-weight: 300;
      padding: 2px 0;
    }
    nav.main a:hover { color: var(--accent); }
    nav.main a.current { color: var(--accent); }
    nav.main a:focus-visible,
    main a:focus-visible {
      outline: 1px solid var(--accent); outline-offset: 3px;
    }

    /* ---- WP page-title grammar: big light heading + thin accent rule ---- */
    main h1 {
      font-size: clamp(34px, 6vw, 56px); font-weight: 200;
      line-height: 1.06; margin: 40px 0 6px; letter-spacing: -0.01em;
    }
    main h2 {
      font-size: 24px; font-weight: 300; margin: 2.2em 0 10px;
      padding-bottom: 6px; border-bottom: 1px solid var(--hairline);
    }
    .tile .tile-title { border-bottom: none; padding-bottom: 0; margin: 0 0 6px; }
    main h3 { font-size: 19px; font-weight: 400; margin: 1.6em 0 8px; }
    main p { color: #d9d9d9; max-width: 72ch; }
    main li { color: #d9d9d9; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    blockquote {
      margin: 1.4em 0; padding: 12px 20px;
      background: transparent; border-left: none; border: none;
      font-weight: 200; font-style: normal;
      font-size: 22px; color: var(--fg); line-height: 1.4;
    }

    code, pre { font-family: Consolas, "Cascadia Code", monospace; }
    pre { background: var(--surface); padding: 14px 16px; overflow-x: auto; }
    code { background: var(--surface); padding: 2px 6px; font-size: 90%; }
    pre code { background: transparent; padding: 0; }

    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th {
      text-align: left; padding: 8px 12px;
      font-weight: 400; font-size: 13px; text-transform: lowercase;
      color: var(--accent); border-bottom: 1px solid var(--hairline);
    }
    td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--hairline); vertical-align: top; }

    img, video { max-width: 100%; display: block; }

    /* ---- tiles: the signature ---- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-flow: dense;
      gap: 8px;                       /* WP gutter is tight */
      margin: 28px 0 8px;
    }
    .tile p { margin: 0; color: #cfcfcf; font-size: 14px; font-weight: 400; line-height: 1.5; }
    .tile.accent .tile-kicker { color: #ffffff; }
    .tile {
      grid-column: span 2;
      min-height: 120px;
      background: var(--tile-dark);
      padding: 16px 16px 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative;
      transition: transform .08s ease-out;
    }
    .tile.wide { grid-column: span 4; }
    .tile.narrow { grid-column: span 2; }
    .tile.accent { background: var(--tile-a); }
    .tile.accent .tile-title, .tile.accent p { color: #ffffff; }
    .tile::after {                   /* WP glyph corner: subtle chevron */
      content: "›"; position: absolute; right: 10px; bottom: 2px;
      font-size: 22px; font-weight: 300; opacity: .35; color: #fff;
    }
    @media (hover: hover) {
      a.tile:hover, a.tile:focus-visible { transform: scale(.97); text-decoration: none; }
    }
    a.tile:active { transform: scale(.97); }
    a.tile:focus-visible {
      outline: 1px solid var(--accent); outline-offset: 2px; text-decoration: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      a.tile:hover, a.tile:active { transform: none; }
    }
    .tile .tile-kicker {
      font-size: 11px; letter-spacing: .12em; text-transform: lowercase;
      color: var(--accent); margin: 0 0 6px; font-weight: 400;
    }
    .tile .tile-title { font-size: 20px; font-weight: 300; margin: 0 0 6px; color: var(--fg); line-height: 1.15; }

    @media (max-width: 720px) {
      .tiles { grid-template-columns: repeat(2, 1fr); }
      .tile, .tile.narrow { grid-column: span 2; }   /* two-up medium tiles */
      .tile.wide { grid-column: span 2; }             /* encyclopedia goes full-bleed */
    }

    /* ---- hero (home only) ---- */
    .hero { padding: 34px 0 0; }
    .hero .kicker {
      color: var(--accent); font-size: 13px; font-weight: 400;
      letter-spacing: .02em; margin: 0 0 4px;
    }
    .hero h1 {
      font-size: clamp(38px, 7vw, 64px); font-weight: 200;
      line-height: 1.04; margin: 0 0 14px; letter-spacing: -0.015em;
    }
    .hero p.lead { font-size: 19px; font-weight: 300; color: var(--fg-dim); max-width: 68ch; }

    main ol.steps { list-style: none; margin: 1em 0; padding: 0; max-width: none; }
    main ol.steps li {
      padding: 14px 4px; border-bottom: 1px solid var(--hairline);
      color: #d9d9d9; font-size: 15px;
    }
    main ol.steps li::before {
      content: attr(data-step); display: inline-block;
      width: 2.2em; color: var(--accent); font-size: 26px; font-weight: 200;
      vertical-align: -0.12em; margin-right: 10px;
    }

    /* ---- status badges: flat squares, WP toast palette ---- */
    .status-badge { display: inline-block; padding: 3px 10px; font-size: 11px; letter-spacing: .08em; text-transform: lowercase; }
    .status-spec { background: #333333; color: #fff; }
    .status-building { background: #ca5010; color: #fff; }
    .status-shipped { background: #107c10; color: #fff; }
    .status-verified { background: var(--accent); color: #fff; }

    footer.site { border-top: 1px solid var(--hairline); margin-top: 80px; }
    footer.site .wrap { padding: 22px 24px 40px; color: #9d9d9d; font-size: 13.5px; font-weight: 400; }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="brand">
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <span class="tagline">{{ site.tagline }}</span>
      </div>
      <nav class="main">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/index.html' or page.url == '/' %}class="current"{% endif %}>home</a>
        <a href="{{ '/paradigms/' | relative_url }}" {% if page.url == '/paradigms/' %}class="current"{% endif %}>paradigms</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url == '/research/' %}class="current"{% endif %}>research</a>
        <a href="{{ '/captures/' | relative_url }}" {% if page.url == '/captures/' %}class="current"{% endif %}>captures</a>
        <a href="{{ '/resources/' | relative_url }}" {% if page.url == '/resources/' %}class="current"{% endif %}>resources</a>
        <a href="{{ '/essays/' | relative_url }}" {% if page.url == '/essays/' %}class="current"{% endif %}>essays</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="current"{% endif %}>about</a>
        <a href="https://github.com/Chinmay-KB/wp_pivot_flutter/blob/master/docs/ROADMAP.md">roadmap ↗</a>
        <a href="{{ site.github_repo }}">github ↗</a>
      </nav>
    </div>
  </header>

  <!-- direction contract lives at body start; see comment above -->
  <div class="wrap">
    <main>
      {{ content }}
    </main>
  </div>

  <footer class="site">
    <div class="wrap">
      Part of <a href="{{ site.github_repo }}">wp_pivot_flutter</a> — measured, not remembered.
      Raw capture data ships with every conclusion.
    </div>
  </footer>
</body>
</html>
